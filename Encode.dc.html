<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: oklch(97% 0.015 95);
      --card: oklch(99% 0.008 95);
      --text: oklch(24% 0.02 95);
      --text-soft: oklch(48% 0.02 95);
      --accent: oklch(58% 0.09 150);
      --accent-dark: oklch(42% 0.08 150);
      --accent-soft: oklch(93% 0.03 150);
      --border: oklch(89% 0.015 95);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; background: oklch(93% 0.01 250); color: var(--text); }
    a { color: var(--accent); } a:hover { color: var(--accent-dark); }
  </style>
</helmet>

<div style="display:flex; align-items:center; justify-content:center; width:100%; min-height:100%; padding:40px 0;">
  <div style="width:390px; height:844px; border-radius:44px; border:1px solid var(--border); background: var(--bg); overflow:hidden; box-shadow: 0 20px 60px oklch(30% 0.02 260 / 0.18); display:flex; flex-direction:column;">

    <div style="flex:1; overflow:hidden; padding:48px 22px 0 22px; display:flex; flex-direction:column; gap:16px;">

      <div style="display:flex; flex-direction:column; gap:2px;">
        <div style="font-size:13px; color:var(--text-soft); font-weight:500;">Jeudi 22 août</div>
        <div style="font-size:20px; font-weight:800;">Ta journée</div>
      </div>

      <div style="background: var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;">
        <div style="display:flex; flex-direction:column; gap:2px;">
          <div style="font-size:12px; font-weight:600; color:var(--text-soft);">Poids ce matin</div>
          <div style="font-size:11.5px; color:var(--text-soft);">optionnel</div>
        </div>
        <div style="display:flex; align-items:baseline; gap:6px; background: var(--accent-soft); border-radius:12px; padding:8px 14px;">
          <div style="font-size:20px; font-weight:800; color:var(--accent-dark);">123,4</div>
          <div style="font-size:13px; font-weight:600; color:var(--accent-dark);">kg</div>
        </div>
      </div>

      <div style="overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding-bottom:8px;">

        <div style="display:flex; flex-direction:column; gap:9px;">
          <div style="font-size:12.5px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.04em;">Matin</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <sc-for list="{{morning}}" as="c" hint-placeholder-count="3">
              <button style="{{c.style}}" onClick="{{c.onClick}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:9px;">
          <div style="font-size:12.5px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.04em;">Midi</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <sc-for list="{{lunch}}" as="c" hint-placeholder-count="3">
              <button style="{{c.style}}" onClick="{{c.onClick}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:9px;">
          <div style="font-size:12.5px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.04em;">Grignote</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <sc-for list="{{snack}}" as="c" hint-placeholder-count="3">
              <button style="{{c.style}}" onClick="{{c.onClick}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:9px;">
          <div style="font-size:12.5px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.04em;">Soir</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <sc-for list="{{evening}}" as="c" hint-placeholder-count="3">
              <button style="{{c.style}}" onClick="{{c.onClick}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <button style="{{walkStyle}}" onClick="{{toggleWalk}}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path d="M13 4a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="{{walkIconColor}}"/><path d="M10 22l2-7-3-2 1-5 4 2 1 4 3 2M9 13l-4 2" stroke="{{walkIconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Marche du midi (~30 min)
        </button>

      </div>

      <div style="flex:1;"></div>

      <div style="padding-bottom:14px; display:flex; flex-direction:column; gap:8px;">
        <button style="all:unset; cursor:pointer; background: var(--accent); color:white; font-family:inherit; font-size:15.5px; font-weight:700; text-align:center; padding:16px; border-radius:18px; box-shadow: 0 8px 20px oklch(58% 0.09 150 / 0.3);">
          Valider ma journée
        </button>
        <div style="text-align:center; font-size:12.5px; color:var(--text-soft);">Pas besoin d'être parfait, juste présent.</div>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
const UNSELECTED = "all:unset; cursor:pointer; box-sizing:border-box; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text); background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:10px 14px; line-height:1.3;";
const SELECTED = "all:unset; cursor:pointer; box-sizing:border-box; font-family:inherit; font-size:13.5px; font-weight:700; color:white; background:var(--accent); border:1.5px solid var(--accent); border-radius:14px; padding:10px 14px; line-height:1.3;";
const WALK_OFF = "all:unset; cursor:pointer; box-sizing:border-box; display:flex; align-items:center; gap:8px; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text); background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:12px 14px;";
const WALK_ON = "all:unset; cursor:pointer; box-sizing:border-box; display:flex; align-items:center; gap:8px; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--accent-dark); background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:14px; padding:12px 14px;";

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { morning: 'eggs3', lunch: 'tupperware', snack: 'skyr', evening: 'chicken', walked: true };
  }
  pick(group, value) {
    return () => this.setState({ [group]: value });
  }
  chips(group, options) {
    return options.map((o) => ({
      label: o.label,
      style: this.state[group] === o.value ? SELECTED : UNSELECTED,
      onClick: this.pick(group, o.value)
    }));
  }
  renderVals() {
    return {
      morning: this.chips('morning', [
        { value: 'eggs3', label: '3 œufs' },
        { value: 'eggs2', label: '2 œufs' },
        { value: 'coffee', label: 'Café seulement' }
      ]),
      lunch: this.chips('lunch', [
        { value: 'tupperware', label: 'Tupperware poulet-riz-courgette' },
        { value: 'saladskyr', label: 'Salade + skyr' },
        { value: 'skipped', label: "Pas eu le temps" }
      ]),
      snack: this.chips('snack', [
        { value: 'skyr', label: 'Skyr + fruit' },
        { value: 'fruit', label: 'Pomme / orange' },
        { value: 'none', label: "Rien aujourd'hui" }
      ]),
      evening: this.chips('evening', [
        { value: 'chicken', label: 'Poulet + légumes + riz' },
        { value: 'omelette', label: 'Omelette légumes' },
        { value: 'other', label: 'Autre' }
      ]),
      walkStyle: this.state.walked ? WALK_ON : WALK_OFF,
      walkIconColor: this.state.walked ? 'var(--accent-dark)' : 'var(--text-soft)',
      toggleWalk: () => this.setState({ walked: !this.state.walked })
    };
  }
}
</script>
</body>
</html>
