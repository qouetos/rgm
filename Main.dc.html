<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: oklch(97% 0.015 95);
      --card: oklch(99% 0.008 95);
      --text: oklch(24% 0.02 95);
      --text-soft: oklch(48% 0.02 95);
      --accent: oklch(58% 0.09 150);
      --accent-dark: oklch(42% 0.08 150);
      --accent-soft: oklch(93% 0.03 150);
      --accent2: oklch(68% 0.11 45);
      --accent2-soft: oklch(94% 0.03 45);
      --border: oklch(89% 0.015 95);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; background: oklch(93% 0.01 250); color: var(--text); }
    a { color: var(--accent); } a:hover { color: var(--accent-dark); }
  </style>
</helmet>

<div style="display:flex; align-items:center; justify-content:center; width:100%; min-height:100%; padding:40px 0;">
  <div style="width:390px; height:844px; border-radius:44px; border:1px solid var(--border); background: var(--bg); overflow:hidden; box-shadow: 0 20px 60px oklch(30% 0.02 260 / 0.18); display:flex; flex-direction:column;">

    <div style="flex:1; overflow:hidden; padding:52px 22px 0 22px; display:flex; flex-direction:column; gap:18px;">

      <div style="display:flex; flex-direction:column; gap:2px;">
        <div style="font-size:13px; color:var(--text-soft); font-weight:500;">Jeudi 22 août</div>
        <div style="font-size:22px; font-weight:800;">Bonjour Quentin</div>
      </div>

      <div style="background: var(--card); border:1px solid var(--border); border-radius:24px; padding:22px 22px 20px 22px; display:flex; flex-direction:column; gap:14px;">
        <div style="display:flex; align-items:baseline; justify-content:space-between;">
          <div style="display:flex; flex-direction:column; gap:4px;">
            <div style="font-size:12px; font-weight:600; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.04em;">Poids actuel</div>
            <div style="display:flex; align-items:baseline; gap:8px;">
              <div style="font-size:40px; font-weight:800; line-height:1;">123,4</div>
              <div style="font-size:16px; font-weight:600; color:var(--text-soft);">kg</div>
            </div>
            <div style="font-size:13px; font-weight:600; color:var(--accent-dark);">-0,6 kg depuis le début</div>
          </div>
          <svg width="108" height="56" viewBox="0 0 108 56" fill="none">
            <polyline points="4,14 40,20 74,34 104,44" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="4" cy="14" r="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
            <circle cx="104" cy="44" r="4.5" fill="var(--accent)"/>
          </svg>
        </div>

        <div style="height:1px; background: var(--border);"></div>

        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:34px; height:34px; border-radius:10px; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 15 L11 9 L15 12 L19 6" stroke="var(--accent-dark)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="font-size:13.5px; color:var(--text-soft); line-height:1.4;">Objectif <strong style="color:var(--text);">94 kg</strong> au <strong style="color:var(--text);">1 mai 2027</strong></div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
        <div style="background: var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:6px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="var(--text-soft)" stroke-width="1.8"/><path d="M3 9h18M8 2v4M16 2v4" stroke="var(--text-soft)" stroke-width="1.8" stroke-linecap="round"/></svg>
          <div style="font-size:24px; font-weight:800;">252</div>
          <div style="font-size:12.5px; color:var(--text-soft); font-weight:500;">jours restants</div>
        </div>
        <div style="background: var(--accent2-soft); border:1px solid oklch(88% 0.04 45); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:6px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1.5-1-2.5-1-2.5s2 1 2 4.5a5 5 0 0 1-10 0C6 8 9 6 12 2Z" stroke="var(--accent2)" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <div style="font-size:24px; font-weight:800; color:oklch(38% 0.09 45);">3 jours</div>
          <div style="font-size:12.5px; color:oklch(45% 0.07 45); font-weight:500;">d'affilée</div>
        </div>
      </div>

      <div style="flex:1;"></div>

      <button style="all:unset; cursor:pointer; background: var(--accent); color:white; font-family:inherit; font-size:15.5px; font-weight:700; text-align:center; padding:16px; border-radius:18px; box-shadow: 0 8px 20px oklch(58% 0.09 150 / 0.3);">
        Encoder ma journée
      </button>
      <a href="#" style="display:block; text-align:center; font-size:13.5px; font-weight:600; padding-bottom:14px;">Voir l'historique</a>
    </div>

    <div style="flex-shrink:0; display:flex; justify-content:space-around; align-items:center; padding:12px 12px 22px 12px; border-top:1px solid var(--border); background: var(--card);">
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--accent-dark);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7M6 10v9h12v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-size:10.5px; font-weight:700;">Accueil</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-soft);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size:10.5px; font-weight:600;">Encoder</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-soft);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 19V10M11 19V5M18 19v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div style="font-size:10.5px; font-weight:600;">Historique</div>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
