<!doctype html>

<x-dc>
<helmet>

  <style>

      --text: oklch(24% 0.02 95);
      --text-soft: oklch(48% 0.02 95);
      --accent: oklch(58% 0.09 150);
      --accent-dark: oklch(42% 0.08 150);
      --border: oklch(89% 0.015 95);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; background: oklch(93% 0.01 250); color: var(--text); }

<div style="display:flex; align-items:center; justify-content:center; width:100%; min-height:100%; padding:40px 0;">
  <div style="width:390px; height:844px; border-radius:44px; border:1px solid oklch(80% 0.02 250); overflow:hidden; box-shadow: 0 20px 60px oklch(30% 0.02 260 / 0.25); position:relative; background: linear-gradient(165deg, oklch(80% 0.05 250) 0%, oklch(66% 0.07 265) 60%, oklch(55% 0.08 275) 100%);">

    <div style="position:absolute; inset:0; backdrop-filter: blur(14px); background: oklch(40% 0.03 260 / 0.28);"></div>

    <div style="position:relative; padding:110px 16px 0 16px;">

      <div style="background: oklch(98% 0.005 250 / 0.92); backdrop-filter: blur(20px); border-radius:20px; padding:14px 16px; display:flex; gap:12px; box-shadow: 0 12px 30px oklch(20% 0.02 260 / 0.3);">
        <div style="width:40px; height:40px; border-radius:11px; background: linear-gradient(160deg, oklch(66% 0.1 150) 0%, oklch(52% 0.09 150) 100%); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M6 15 L11 9 L15 12 L19 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 6 H19 V11" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:3px; min-width:0;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="font-size:13px; font-weight:700; color:var(--text);">Cap</div>
            <div style="font-size:12px; color:var(--text-soft); font-weight:500;">maintenant</div>
          </div>
          <div style="font-size:14px; font-weight:700; color:var(--text); line-height:1.35;">N'oublie pas d'encoder ta journée</div>
          <div style="font-size:13px; color:var(--text-soft); line-height:1.4;">30 secondes suffisent — même juste le poids.</div>
        </div>
      </div>

      <div style="margin-top:14px; background: oklch(98% 0.005 250 / 0.75); backdrop-filter: blur(16px); border-radius:16px; padding:12px 16px; font-size:12.5px; color: oklch(30% 0.02 250); font-weight:500; text-align:center;">
        Envoyée une fois par jour, à l'heure que tu choisis
      </div>

    </div>
  </div>
</div>
